<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用者ログイン | Hitch Tac</title>
  <link rel="stylesheet" href="../top/assets/css/top.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script src="../shared/js/auth.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../top/index.html" aria-label="Hitch Tac トップ">
          <span class="brand-mark">HT</span>
          <span><strong>Hitch Tac</strong><small>地域AI乗り合い交通</small></span>
        </a>
      </div>
    </header>
    <main class="login-main">
      <a class="back-link" href="../top/index.html">← トップに戻る</a>
      <section class="login-panel" aria-labelledby="page-title">
        <div class="login-heading-row">
          <p class="eyebrow" id="role-label">利用者向け</p>
          <p class="registration-link"><a id="register-link" href="register.html?role=user&amp;next=reservation">新規登録はこちら</a></p>
        </div>
        <h1 id="page-title">利用者ログイン</h1>
        <p class="login-description" id="login-description">ログイン後、新規予約へ進みます。</p>
        <form id="login-form">
          <div class="form-field">
            <label for="email">メールアドレス <span class="required">必須</span></label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="example@example.com" required>
          </div>
          <div class="form-field">
            <label for="password">パスワード <span class="required">必須</span></label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          </div>
          <p id="login-error" class="form-error" role="alert" aria-live="assertive"></p>
          <button class="login-button" type="submit">ログイン</button>
        </form>
        <noscript><p>ログインするにはブラウザのJavaScriptを有効にしてください。</p></noscript>
      </section>
    </main>
  </div>
</body>
</html>
