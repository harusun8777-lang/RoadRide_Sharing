<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用者ログイン | RoadRide Sharing</title>
  <link rel="stylesheet" href="../top/assets/css/top.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script src="assets/js/login.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../top/index.html" aria-label="RoadRide Sharing トップ">
          <span class="brand-mark">RR</span>
          <span><strong>RoadRide Sharing</strong><small>地域AI乗り合い交通</small></span>
        </a>
      </div>
    </header>
    <main class="login-main">
      <a class="back-link" href="../top/index.html">← トップに戻る</a>
      <section class="login-panel" aria-labelledby="page-title">
        <div class="login-heading-row">
          <p class="eyebrow" id="role-label">利用者向け</p>
          <p class="registration-link"><a id="register-link" href="register.html?role=user&amp;next=reservation">新規登録はこちら</a></p>
        </div>
        <h1 id="page-title">利用者ログイン</h1>
        <p class="login-description" id="login-description">ログイン後、新規予約へ進みます。</p>
        <p class="demo-notice" id="demo-notice">現在は仮ログインです。メールアドレスとパスワードの入力のみ確認します。実際に使用しているパスワードは入力しないでください。</p>
        <form id="login-form" aria-describedby="demo-notice">
          <div class="form-field">
            <label for="login-identifier" id="identifier-label">メールアドレス <span class="required">必須</span></label>
            <input id="login-identifier" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="example@example.com" required>
          </div>
          <div class="form-field">
            <label for="password">パスワード <span class="required">必須</span></label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="login-button" type="submit">ログイン</button>
        </form>
        <p id="registration-status" class="demo-notice" role="status" hidden>仮登録の入力確認が完了しました。アカウントはまだ作成されていません。仮ログインで画面を確認できます。</p>
        <noscript><p>ログインするにはブラウザのJavaScriptを有効にしてください。</p></noscript>
      </section>
    </main>
  </div>
</body>
</html>
