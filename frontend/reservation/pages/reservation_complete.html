<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>予約完了 | Hitch Tac</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/reservation_complete.css">
  <script src="../../shared/js/auth.js" defer></script>
  <script src="../assets/js/reservation_api.js" defer></script>
  <script src="../assets/js/reservation_complete.js" defer></script>
  <link rel="stylesheet" href="../assets/css/account.css">
  <script src="../assets/js/account.js" defer></script>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">HT</div>
        <div>
          <strong>Hitch Tac</strong>
          <small>地域AI乗り合い交通</small>
        </div>
      </div>
    </div>
  </header>

  <main class="main complete-page">
    <section class="panel complete-panel">
      <p class="eyebrow">COMPLETE</p>
      <h1>予約が完了しました</h1>

      <p class="loading-message" id="page-loading" role="status" hidden></p>
      <p class="alert" id="page-error" role="alert" hidden></p>

      <div class="reservation-number-box">
        <span class="reservation-number-label">予約番号</span>
        <strong id="reservation-number">---</strong>
      </div>

      <dl class="complete-summary" id="reservation-summary" hidden>
        <div>
          <dt>希望乗車日時</dt>
          <dd id="summary-datetime">---</dd>
        </div>
        <div>
          <dt>乗車場所</dt>
          <dd id="summary-pickup">---</dd>
        </div>
        <div>
          <dt>目的地</dt>
          <dd id="summary-destination">---</dd>
        </div>
        <div>
          <dt>乗車人数</dt>
          <dd id="summary-passengers">---</dd>
        </div>
      </dl>

      <div class="button-area">
        <a class="primary link-button" id="detail-button" href="reservation_detail.html">
          予約詳細
        </a>
        <a class="secondary link-button" id="history-button" href="reservation_history.html">
          予約履歴
        </a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要画面">
    <a class="bottom-nav-item is-active" href="reservation.html" aria-current="page">
      <span aria-hidden="true">＋</span>
      <small>新規予約</small>
    </a>
    <a class="bottom-nav-item" href="reservation_history.html">
      <span aria-hidden="true">▦</span>
      <small>予約履歴</small>
    </a>
    <span class="bottom-nav-item is-disabled" aria-disabled="true">
      <span aria-hidden="true">◷</span>
      <small>運行状況</small>
    </span>
  </nav>

</body>
</html>
