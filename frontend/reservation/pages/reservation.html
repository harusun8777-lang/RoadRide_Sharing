<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乗車予約 | RoadRide Sharing</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/reservation.css">
  <script src="../../shared/js/auth.js" defer></script>
  <script src="../assets/js/reservation_api.js" defer></script>
  <script src="../assets/js/reservation.js" defer></script>
  <link rel="stylesheet" href="../assets/css/account.css">
  <script src="../assets/js/account.js" defer></script>
  <script src="../assets/js/map.js" defer></script>
  <!-- map.js（defer）の後に実行されるよう defer にする。async だと initMaps の定義前にコールバックが呼ばれることがある -->
  <script defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdZTxOsa9cRkjSvOkhPLDJLVHvxKU0lcA&callback=initMaps">
</script>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">RR</div>
          <div>
            <strong>RoadRide Sharing</strong>
            <small>地域AI乗り合い交通</small>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="intro">
        <nav class="breadcrumb" aria-label="現在位置">
          <a href="reservation_history.html">予約履歴</a>
          <span aria-hidden="true">→</span>
          <span>乗車予約</span>
        </nav>
        <p class="eyebrow">RESERVATION</p>
        <h1>乗車予約</h1>
        <p>
          乗車場所と目的地を入力して、地域の乗り合い交通を予約します。
        </p>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite">
        予約内容を確認する画面へ進みます。
      </div>

      <section class="panel" aria-label="乗車予約フォーム">
        <div class="panel-heading">
          <div>
            <h2>乗車予約</h2>
            <p>必須項目を入力してください。</p>
          </div>
          <span class="status info">新規予約</span>
        </div>

        <form id="reservation-form">
          <div class="form-grid">
            <div class="field">
              <label for="pickup-postcode">
                乗車場所の郵便番号（任意）
              </label>
              <div class="postcode-row">
                <input id="pickup-postcode" name="pickup-postcode" type="text" inputmode="numeric"
                  placeholder="郵便番号 例: 860-0001">
                <button type="button" class="secondary" id="pickup-search">
                  住所を検索
                </button>
              </div>
              <p class="hint" id="pickup-address-hint">
                郵便番号を入力せず、住所を直接入力することもできます。
              </p>

              <label for="pickup-address">乗車場所の住所 <span class="required">必須</span></label>
              <input id="pickup-address" name="pickup-address" maxlength="200" aria-describedby="pickup-address-hint"
                type="text" placeholder="住所" required>

              <div class="field full" style="margin-top: 16px;">
                <label>地図から乗車場所を選択</label>
                <div id="pickup-map" style="width: 100%; height: 300px; border-radius: 8px; margin-top: 8px;"></div>
                <p class="hint">地図をタップすると住所が自動入力されます。</p>
              </div>
            </div>

            <div class="field">
              <label for="destination-postcode">目的地の郵便番号（任意）</label>

              <div class="postcode-row">
                <input id="destination-postcode" name="destination-postcode" type="text" inputmode="numeric"
                  placeholder="郵便番号 例: 860-0001">
                <button type="button" class="secondary" id="destination-search">住所を検索</button>
              </div>

              <p class="hint" id="destination-address-hint">
                郵便番号を入力せず、住所を直接入力することもできます。
              </p>

              <label for="destination-address">目的地の住所 <span class="required">必須</span></label>
              <input id="destination-address" name="destination-address" maxlength="200"
                aria-describedby="destination-address-hint" type="text" placeholder="住所" required>

              <!-- ★ destination-map（目的地） -->
              <div class="field full" style="margin-top: 16px;">
                <label>地図から目的地を選択</label>
                <div id="destination-map" style="width: 100%; height: 300px; border-radius: 8px; margin-top: 8px;">
                </div>
                <p class="hint">地図をタップすると住所が自動入力されます。</p>
              </div>
            </div>

            <div class="field">
              <label for="date">
                希望乗車日 <span class="required">必須</span>
              </label>
              <input id="date" name="date" type="date" required>
              <p class="error-message" id="date-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="time-hour">
                希望乗車時刻 <span class="required">必須</span>
              </label>

              <div class="time-row">
                <select id="time-hour" name="time-hour" required></select>
                <span>:</span>
                <select id="time-minute" name="time-minute" required></select>
              </div>
            </div>

            <div class="field">
              <label for="passengers">
                乗車人数 <span class="required">必須</span>
              </label>
              <select id="passengers" name="passengers" required>
                <option value="1">1名</option>
                <option value="2">2名</option>
                <option value="3">3名</option>
                <option value="4">4名</option>
              </select>
            </div>

            <div class="field">
              <label for="care">配慮事項</label>
              <select id="care" name="care">
                <option value="">なし</option>
                <option value="wheelchair">車いす</option>
                <option value="large-luggage">大きな荷物</option>
                <option value="other">その他</option>
              </select>
            </div>

            <div class="field full">
              <label for="notes">補足事項</label>
              <textarea
                id="notes"
                name="notes"
                maxlength="480"
                placeholder="配車担当者に伝えたいことがあれば入力してください"
              ></textarea>
              <p class="hint">入力内容は配車担当者が確認します。</p>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">
              予約内容を確認
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="主要画面">
    <a class="bottom-nav-item is-active" href="reservation.html" aria-current="page">
      <span aria-hidden="true">＋</span>
      <small>新規予約</small>
    </a>
    <a class="bottom-nav-item" href="reservation_history.html">
      <span aria-hidden="true">▦</span>
      <small>予約履歴</small>
    </a>
    <span class="bottom-nav-item is-disabled" aria-disabled="true">
      <span aria-hidden="true">◷</span>
      <small>運行状況</small>
    </span>
  </nav>
</body>

</html>
