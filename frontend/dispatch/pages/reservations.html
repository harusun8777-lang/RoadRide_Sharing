<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約一覧 | RoadRide Sharing</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/reservations.css">
  <link rel="stylesheet" href="../../reservation/assets/css/account.css">
  <script src="../../shared/js/auth.js" defer></script>
  <script src="../../reservation/assets/js/account.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="dashboard.html" aria-label="配車ダッシュボードへ戻る">
          <span class="brand-mark">RR</span>
          <span>
            <strong>RoadRide Sharing</strong>
            <small>配車管理</small>
          </span>
        </a>
        <div class="header-user">
          <span class="avatar">田</span>
          <span class="user-name">田中 健一</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <section class="page-heading">
        <div>
          <p class="eyebrow">DISPATCH CENTER</p>
          <h1>予約一覧</h1>
          <p class="page-description">予約を検索し、状態を確認します。</p>
        </div>
      </section>

      <section class="workspace" aria-label="予約検索と一覧">
        <div class="list-panel panel">
          <div class="panel-heading">
            <div>
              <h2>予約データ</h2>
              <p><span id="result-count">0</span>件の予約を表示中</p>
            </div>
            <button class="icon-button" id="refresh-button" type="button" title="一覧を初期状態に戻す" aria-label="一覧を初期状態に戻す">↻</button>
          </div>

          <div class="filters">
            <label class="search-field">
              <span>予約を検索</span>
              <input id="search-input" type="search" placeholder="予約番号・乗車場所・目的地" autocomplete="off">
            </label>
            <label>
              <span>乗車日</span>
              <select id="date-filter">
                <option value="all">すべての日付</option>
                <option value="2026-09-21">9月21日</option>
                <option value="2026-09-22">9月22日</option>
              </select>
            </label>
            <label>
              <span>状態</span>
              <select id="status-filter">
                <option value="all">すべての状態</option>
                <option value="matching">マッチング中</option>
                <option value="confirmed">予約確定</option>
                <option value="in_progress">運行中</option>
                <option value="completed">乗車完了</option>
                <option value="cancelled">キャンセル</option>
              </select>
            </label>
          </div>

          <div class="table-container">
            <table>
              <caption class="visually-hidden">予約一覧</caption>
              <thead>
                <tr>
                  <th scope="col">乗車予定</th>
                  <th scope="col">乗車場所</th>
                  <th scope="col">目的地</th>
                  <th scope="col">状態</th>
                </tr>
              </thead>
              <tbody id="reservation-table-body"></tbody>
            </table>
            <div class="empty-state" id="empty-state" hidden>
              <span class="empty-icon">⌕</span>
              <strong>該当する予約がありません</strong>
              <p>検索条件を変更して、もう一度お試しください。</p>
            </div>
          </div>
        </div>

      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <a class="bottom-nav-item" href="dashboard.html"><span>⌂</span><small>ダッシュボード</small></a>
      <a class="bottom-nav-item is-active" href="reservations.html"><span>▦</span><small>予約一覧</small></a>
      <a class="bottom-nav-item" href="reservations.html?status=in_progress"><span>◷</span><small>運行状況</small></a>
    </nav>
  </div>
  <script src="../assets/js/reservations.js"></script>
</body>
</html>
