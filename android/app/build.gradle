plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.roadride.sharing'
    compileSdk 34

    defaultConfig {
        applicationId "com.roadride.sharing"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // デプロイ後のベースURLをここで管理する
        buildConfigField "String", "RIDER_URL",      "\"https://your-domain.example.com/frontend/reservation/pages/reservation.html\""
        buildConfigField "String", "DISPATCHER_URL", "\"https://your-domain.example.com/frontend/dispatch/pages/dashboard.html\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
