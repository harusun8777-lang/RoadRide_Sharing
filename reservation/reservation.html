<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乗車予約 | RoadRide Sharing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">RR</div>
          <div>
            <strong>RoadRide Sharing</strong>
            <small>地域AI乗り合い交通</small>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="intro">
        <p class="eyebrow">RESERVATION</p>
        <h1>乗車予約</h1>
        <p>
          乗車場所と目的地を入力して、地域の乗り合い交通を予約します。
        </p>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite">
        予約内容を確認する画面へ進みます。
      </div>

      <section class="panel" aria-label="乗車予約フォーム">
        <div class="panel-heading">
          <div>
            <h2>乗車予約</h2>
            <p>必須項目を入力してください。</p>
          </div>
          <span class="status info">新規予約</span>
        </div>

        <form id="reservation-form">
          <div class="form-grid">
            <div class="field">
              <label for="pickup-postcode">
                乗車場所 <span class="required">必須</span>
              </label>

              <div class="postcode-row">
                <input
                  id="pickup-postcode"
                  name="pickup-postcode"
                  type="text"
                  inputmode="numeric"
                  placeholder="郵便番号 例: 860-0001"
                >
                <button type="button" class="secondary" id="pickup-search">
                  住所を検索
                </button>
              </div>

              <input
                id="pickup-address"
                name="pickup-address"
                type="text"
                placeholder="住所"
                required
              >
            </div>

            <div class="field">
              <label for="destination-postcode">
                目的地 <span class="required">必須</span>
              </label>

              <div class="postcode-row">
                <input
                  id="destination-postcode"
                  name="destination-postcode"
                  type="text"
                  inputmode="numeric"
                  placeholder="郵便番号 例: 860-0001"
                >
                <button type="button" class="secondary" id="destination-search">
                  住所を検索
                </button>
              </div>

              <input
                id="destination-address"
                name="destination-address"
                type="text"
                placeholder="住所"
                required
              >
            </div>

            <div class="field">
              <label for="date">
                希望乗車日 <span class="required">必須</span>
              </label>
              <input
                id="date"
                name="date"
                type="date"
                required
              >
            </div>

            <div class="field">
              <label for="time">
                希望乗車時刻 <span class="required">必須</span>
              </label>
              <input
                id="time"
                name="time"
                type="time"
                value="10:00"
                required
              >
            </div>

            <div class="field">
              <label for="passengers">
                乗車人数 <span class="required">必須</span>
              </label>
              <select id="passengers" name="passengers" required>
                <option value="1">1名</option>
                <option value="2">2名</option>
                <option value="3">3名</option>
                <option value="4">4名</option>
              </select>
            </div>

            <div class="field">
              <label for="care">配慮事項</label>
              <select id="care" name="care">
                <option value="">なし</option>
                <option value="wheelchair">車いす</option>
                <option value="large-luggage">大きな荷物</option>
                <option value="other">その他</option>
              </select>
            </div>

            <div class="field full">
              <label for="notes">補足事項</label>
              <textarea
                id="notes"
                name="notes"
                placeholder="配車担当者に伝えたいことがあれば入力してください"
              ></textarea>
              <p class="hint">入力内容は配車担当者が確認します。</p>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">
              予約内容を確認
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>
    // 現時点ではUI確認用です。
    // バックエンド接続時にフォーム送信処理へ置き換えます。
    const form = document.querySelector("#reservation-form");
    const toast = document.querySelector("#toast");

    async function searchAddress(postcodeId, addressId) {
      const postcode = document.querySelector(postcodeId).value
        .replace("-", "")
        .trim();

      if (!/^\d{7}$/.test(postcode)) {
        alert("郵便番号を7桁で入力してください。");
        return;
      }

      try {
        const response = await fetch(
          `https://zipcloud.ibsnet.co.jp/api/search?zipcode=${postcode}`
        );

        const data = await response.json();

        if (!data.results) {
          alert("住所が見つかりませんでした。");
          return;
        }

        const result = data.results[0];

        const address =
          result.address1 +
          result.address2 +
          result.address3;

        document.querySelector(addressId).value = address;

      } catch (error) {
        console.error(error);
        alert("住所の取得に失敗しました。");
      }
    }

    document.querySelector("#pickup-search").addEventListener("click", () => {
      searchAddress("#pickup-postcode", "#pickup-address");
    });

    document.querySelector("#destination-search").addEventListener("click", () => {
      searchAddress("#destination-postcode", "#destination-address");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      toast.textContent = "予約内容を確認する画面へ進みます。";
      toast.classList.add("is-visible");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // デモ用に今日の日付を初期値として設定
    const dateInput = document.querySelector("#date");
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    dateInput.value = `${yyyy}-${mm}-${dd}`;
  </script>
</body>
</html>
