name: バックエンドの単体テスト

# PR と main への push でテストを実行する。
# infrastructure 層の DB テスト（Category=Database）は Testcontainers で SQL Server を起動する（ランナーの Docker を使用）
on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "RoadRideSharing.slnx"
      - ".github/workflows/test-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "RoadRideSharing.slnx"
      - ".github/workflows/test-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 日時の変換テストを日本時間で動かす（UTC のランナーでは変換がなくても通ってしまうため）
      TZ: Asia/Tokyo
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: ビルド
        run: dotnet build RoadRideSharing.slnx -c Release

      - name: テスト
        run: >
          dotnet test RoadRideSharing.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
